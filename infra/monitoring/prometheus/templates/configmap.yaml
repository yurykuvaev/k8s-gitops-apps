# prometheus.yml lives in a ConfigMap. Keeps scrape config external to the
# image and editable without rebuilding. Mounted at /etc/prometheus/prometheus.yml.
#
# Three scrape jobs:
#   1. prometheus itself (sanity).
#   2. kube-state-metrics — Kubernetes object state (pod restarts, deployment
#      health, etc.). Discovered via the Service named kube-state-metrics in
#      this namespace.
#   3. node-exporter — node-level metrics (CPU, mem, disk, net) via
#      kubernetes_sd_configs targeting the node-exporter DaemonSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrape.scrapeInterval }}
      evaluation_interval: {{ .Values.scrape.evaluationInterval }}

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.{{ .Release.Namespace }}.svc.cluster.local:8080']

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['{{ .Release.Namespace }}']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: prometheus-node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      # Cluster components: kubelet metrics via the API server proxy.
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
