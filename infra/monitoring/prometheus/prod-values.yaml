# Prod: longer retention, more disk, more resources. Same chart.
#
# Note: same as staging-values.yaml — exists to demonstrate the env-values
# pattern. Real prod tuning would also consider HA (2+ replicas), remote
# write to long-term storage (Thanos/Mimir/Cortex), and Alertmanager.
storage:
  size: 100Gi
  retention: 30d

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
