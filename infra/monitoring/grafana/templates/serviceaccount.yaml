# IRSA-annotated ServiceAccount.
# The ARN matches the trust policy in eks-test-env/secrets_grafana.tf — only
# this exact SA in this exact namespace can assume the role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.irsaRoleArn | quote }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/managed-by: helm
