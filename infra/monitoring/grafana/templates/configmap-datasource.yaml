# Datasource provisioning. Grafana reads files from /etc/grafana/provisioning
# at startup and registers the datasources without needing UI clicks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.datasource.prometheusUrl }}
        isDefault: true
        editable: false
