apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # Grafana reads the password from the mounted CSI file.
            # Path matches the SecretProviderClass and adminSecretName.
            #
            # If the secret is JSON, login will fail. The drill is to exec
            # in, cat this file, see the JSON, and fix at the source (or
            # via jmesPath in the SecretProviderClass).
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: "{{ .Values.adminSecretMountPath }}/{{ .Values.adminSecretName }}"
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ .Values.ingress.host }}"
            # Disable Grafana's anonymous signup/exposed install IDs.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: admin-secret
              mountPath: {{ .Values.adminSecretMountPath }}
              readOnly: true
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
      volumes:
        - name: admin-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: grafana-admin
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
