# SecretProviderClass — declares which AWS Secrets Manager secret should
# be fetched by the Secrets Store CSI driver and mounted into the pod.
#
# IMPORTANT: this is the spot where the JSON-vs-plaintext bug surfaces.
#
# Currently we mount the entire secret value as a single file. Because the
# secret in AWS Secrets Manager is stored as JSON ({"admin-password": "..."}),
# the mounted file contains the literal JSON — and Grafana reads it whole as
# the admin password, which causes login to fail.
#
# Two ways to fix:
#
#   1. Source-side: change aws_secretsmanager_secret_version in
#      eks-test-env/secrets_grafana.tf from jsonencode(...) to a plain string.
#      This is what was done at DigiCert. After re-apply, restart Grafana.
#
#   2. CSI-side: uncomment the jmesPath block below to extract the field.
#      The mount becomes /mnt/secrets/grafana-admin with just the password.
#      Update GF_SECURITY_ADMIN_PASSWORD__FILE accordingly.
#
# Pick one for the drill. Both are valid; the source-side fix is what was
# actually done at DigiCert and is the simpler explanation on the interview.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.adminSecretName }}"
        objectType: "secretsmanager"
        # Uncomment the lines below to apply the CSI-side fix:
        # jmesPath:
        #   - path: "admin-password"
        #     objectAlias: "grafana-admin"
