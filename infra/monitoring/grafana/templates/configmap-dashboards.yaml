# Dashboard provider config. Tells Grafana to load any JSON file in
# /var/lib/grafana/dashboards as a dashboard.
#
# At DigiCert, dashboard ID 1860 (Node Exporter Full) was imported via the
# Grafana UI — kept the same here so the drill matches reality. To populate
# this dashboard, after Grafana is up:
#   1. Open the UI, log in as admin
#   2. Dashboards -> New -> Import
#   3. Enter ID 1860, click Load
#   4. Pick Prometheus datasource, click Import
#
# If you want the dashboard to be provisioned automatically (no manual step),
# add a second ConfigMap with the dashboard JSON and mount it at
# /var/lib/grafana/dashboards. Skipped here on purpose — manual import is
# what actually happened in the DigiCert story.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
