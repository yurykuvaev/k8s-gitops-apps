# Grafana Ingress. Joins the shared lab ALB via the IngressGroup annotation,
# so we do not provision a separate ALB just for Grafana.
#
# IP whitelist is enforced at the ALB via inbound-cidrs. Only listed CIDRs
# pass through; everything else gets 403 from the ALB before traffic ever
# reaches Grafana. Empty list disables the whitelist (open).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.albGroup }}
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    {{- if .Values.ingress.allowedCidrs }}
    alb.ingress.kubernetes.io/inbound-cidrs: "{{ join "," .Values.ingress.allowedCidrs }}"
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
