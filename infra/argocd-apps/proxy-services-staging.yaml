# ArgoCD Applications for proxy-* services in STAGING.
#
# Sync policy: automated.selfHeal=true, prune=false.
# Why: closer-to-prod env, but we still want self-heal. Prune is OFF — if
# a resource disappears from Git (e.g. a values file is accidentally deleted),
# we DO NOT want ArgoCD to immediately delete the live workload. Prune is
# something to enable only after the desired state has been validated as
# the source of truth (DigiCert pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxy-auth-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yurykuvaev/k8s-gitops-apps
    targetRevision: main
    path: apps/_charts/proxy-service
    helm:
      valueFiles:
        - ../../proxy-auth/values/staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
