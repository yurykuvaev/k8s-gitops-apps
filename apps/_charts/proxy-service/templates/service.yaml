apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxy-service.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "proxy-service.name" . }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "proxy-service.name" . }}
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: http
