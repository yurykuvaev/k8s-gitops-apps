{{- if .Values.ingress.enabled }}
# Joins the shared lab ALB via group.name. Adding more proxy services does
# NOT add more ALBs — the AWS LB Controller appends rules to the existing
# listener instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "proxy-service.name" . }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.albGroup }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.healthcheckPath }}
spec:
  rules:
    - host: {{ include "proxy-service.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxy-service.name" . }}
                port:
                  number: {{ .Values.servicePort }}
{{- end }}
